user nginx;

events {
}

http {
  error_log  /var/log/nginx/error_log;

  server {
    # If no Host match, close the connection to prevent host spoofing
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
  }

  # Story Magic config
  server {
    listen 80;
    listen [::]:80;
    server_name storymagic.local;

    # Serve robots.txt
    location /robots.txt {
      alias /var/www/dellatechapps/robots.txt;
    }

    location /static/ {
      proxy_pass http://web:5173/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    # For Vite HMR websocket
    location /@vite/ {
      proxy_pass http://web:5173/@vite/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    # Static files direct access
    location /static_files/ {
      internal;
      alias /var/www/dellatechapps/;
      autoindex off;
      types {
        text/html html;
        text/javascript js;
        text/css css;
        image/png png;
        image/jpeg jpg;
        image/gif gif;
        image/svg+xml svg;
        image/x-icon ico;
        image/webp webp;
      }
    }

    # Proxy API requests to the Django container
    location /api/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://web:8000/kitchenbuddy/api/;
      proxy_redirect /kitchenbuddy/api/ /api/;
    }

    # Admin path
    location /admin/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://web:8000/admin/;
    }

    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://web:8000/storymagic/;
      proxy_redirect /storymagic/ /;
    }
  }

  # Kitchen Buddy config
  server {
    listen 80;
    listen [::]:80;
    server_name kitchenbuddy.local;

    # Define the upstream for the SPA
    set $spa_upstream http://web:5173;

    # Serve robots.txt
    location /robots.txt {
      alias /var/www/dellatechapps/robots.txt;
    }

    # For Vite HMR websocket
    location /@vite/ {
      proxy_pass http://web:5173/@vite/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    # Static files direct access
    location /static_files/ {
      internal;
      alias /var/www/dellatechapps/;
      autoindex off;
      types {
        text/html html;
        text/javascript js;
        text/css css;
        image/png png;
        image/jpeg jpg;
        image/gif gif;
        image/svg+xml svg;
        image/x-icon ico;
        image/webp webp;
      }
    }

    location /u/ {
      try_files $uri $uri/ /static/kitchenbuddy/index.html;
    }

    # Proxy API requests to the Django container
    location /api/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://web:8000/kitchenbuddy/api/;
      proxy_redirect /kitchenbuddy/api/ /api/;
    }

    # Admin path
    location /admin/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://web:8000/admin/;
    }

    # All other paths - serve the SPA for client-side routing
    # JS and CSS files, serve directly from Vite
    location /static/kitchenbuddy/ {
      proxy_pass http://web:5173$uri;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle direct /static/ requests
    location = /static/ {
      return 302;
    }

    # Handle general /static/ requests, such as /static/node_modules/...
    location /static/ {
      proxy_pass http://web:5173;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle main.js requests
    location ~* ^.*/main\.js$ {
      proxy_pass http://web:5173;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      rewrite ^.*/main\.js$ /static/kitchenbuddy/main.js break;
    }

    # For all other requests, serve the SPA index.html for client-side routing
    location / {
      try_files $uri $uri/ /static/kitchenbuddy/index.html;
    }
  }
}
