user nginx;

events {
}

http {
  error_log  /var/log/nginx/error_log;

  server {
    # If no Host match, close the connection to prevent host spoofing
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
  }

  server {
    listen 80;
    listen [::]:80;
    server_name dellatech.local;

    # Serve robots.txt
    location /robots.txt {
      alias /var/www/dellatechapps/robots.txt;
    }

    # For Vite HMR websocket
    location /@vite/ {
      proxy_pass http://web:5173/@vite/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location /node_modules/ {
      proxy_pass http://web:5173/node_modules/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location /static/ {
      alias /var/www/dellatechapps/;
      autoindex off;
      types {
        text/html html;
        text/javascript js;
        text/css css;
        image/png png;
        image/jpeg jpg;
        image/gif gif;
        image/svg+xml svg;
        image/x-icon ico;
        image/webp webp;
      }
    }

    # Admin path
    location /admin/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://web:8000/admin/;
    }

    # Static files direct access
    location /static_files/ {
      alias /var/www/dellatechapps/;
      autoindex off;
      types {
        text/html html;
        text/javascript js;
        text/css css;
        image/png png;
        image/jpeg jpg;
        image/gif gif;
        image/svg+xml svg;
        image/x-icon ico;
        image/webp webp;
      }
    }

    # Tablet routes
    location /tablet/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Prevent caching
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
      add_header Pragma "no-cache";
      add_header Expires "0";

      proxy_pass http://web:8000/tablet/;
    }

    # Kitchen Buddy API routes
    location /kitchenbuddy/api/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://web:8000/kitchenbuddy/api/;
    }

    # Story Magic API routes
    location /storymagic/api/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://web:8000/storymagic/api/;
    }

    # Story Magic app root - proxy to Vite dev server
    location /storymagic/ {
      proxy_pass http://web:5173/storymagic/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Kitchen Buddy app root - proxy to Vite dev server
    location /kitchenbuddy/ {
      proxy_pass http://web:5173/kitchenbuddy/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /kitchenbuddy/u/ {
      rewrite ^/kitchenbuddy/.* /kitchenbuddy/ break;
      proxy_pass http://web:5173;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shared resources - proxy to Vite dev server
    location /shared/ {
      proxy_pass http://web:5173/shared/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- GENERAL ROUTES ---

    # Root path - redirect to kitchenbuddy for now
    location = / {
      return 302 /kitchenbuddy/;
    }
  }
}
