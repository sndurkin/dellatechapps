user nginx;

events {
}

http {
  error_log  /var/log/nginx/error_log;

  server {
    # If no Host match, close the connection to prevent host spoofing
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
  }

  server {
    # Redirect HTTP to HTTPS
    listen 80;
    listen [::]:80;
    server_name dellatech.app www.dellatech.app;

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS server: dellatech.app
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dellatech.app www.dellatech.app;

    ssl_certificate /etc/nginx/ssl/dellatech.app_chained.crt;
    ssl_certificate_key /etc/nginx/ssl/dellatech.app.key;

    # Serve robots.txt
    location /robots.txt {
      alias /var/www/dellatechapps/robots.txt;
    }

    # Serve static files
    location /static/ {
      alias /var/www/dellatechapps/;
      autoindex off;
      types {
        text/html html;
        text/javascript js;
        text/css css;
        image/png png;
        image/jpeg jpg;
        image/gif gif;
        image/svg+xml svg;
        image/x-icon ico;
        image/webp webp;
      }
    }

    # Admin path
    location /admin/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://web:8000/admin/;
    }

    # Static files direct access
    location /static_files/ {
      internal;
      alias /var/www/dellatechapps/;
      autoindex off;
      types {
        text/html html;
        text/javascript js;
        text/css css;
        image/png png;
        image/jpeg jpg;
        image/gif gif;
        image/svg+xml svg;
        image/x-icon ico;
        image/webp webp;
      }
    }

    # Tablet routes
    location /tablet/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Prevent caching
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
      add_header Pragma "no-cache";
      add_header Expires "0";

      proxy_pass http://web:8000/tablet/;
    }

    # Kitchen Buddy API routes
    location /kitchenbuddy/api/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://web:8000/kitchenbuddy/api/;
    }

    # Story Magic API routes
    location /storymagic/api/ {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://web:8000/storymagic/api/;
    }

    # Story Magic app root - serve from static files
    location /storymagic/ {
      try_files $uri $uri/ /static/storymagic/index.html;
    }

    # Kitchen Buddy app root - serve from static files
    location /kitchenbuddy/ {
      try_files $uri $uri/ /static/kitchenbuddy/index.html;
    }

    location /kitchenbuddy/u/ {
      try_files $uri $uri/ /static/kitchenbuddy/index.html;
    }

    # Shared resources - serve from static files
    location /shared/ {
      try_files $uri $uri/ /static/assets/$uri;
    }

    # --- GENERAL ROUTES ---

    # Root path - redirect to kitchenbuddy for now
    location = / {
      return 302 /kitchenbuddy/;
    }
  }

}
