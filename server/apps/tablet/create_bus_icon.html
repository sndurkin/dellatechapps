<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    .icon {
      width: 30px;
      height: 30px;
      display: inline-block;
      background: transparent;
    }

    .icon svg {
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
    }

    button {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <span class="icon">
    <svg id="iconSvg" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
      <polygon
        points="15,2.5 27.5,15 15,27.5 2.5,15"
        fill="#ffffff"
        stroke="#000000"
        stroke-width="3"
      />
      <!-- INLINE font sizing so PNG export matches -->
      <text
        x="15"
        y="14"
        dy="0.35em"
        dx="-0.35"
        font-family="Calibri, Segoe UI, Roboto, Arial, sans-serif"
        font-weight="700"
        font-size="16"
        fill="#000000"
        text-anchor="middle"
      >B</text>
    </svg>
  </span>

  <br />
  <button id="downloadBtn">Download PNG</button>

  <script>
    const downloadBtn = document.getElementById("downloadBtn");
    const svg = document.getElementById("iconSvg");

    downloadBtn.addEventListener("click", () => {
      const serializer = new XMLSerializer();
      const svgStr = serializer.serializeToString(svg);

      const svgBlob = new Blob([svgStr], { type: "image/svg+xml;charset=utf-8" });
      const url = URL.createObjectURL(svgBlob);

      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = 30;
        canvas.height = 30;

        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, 30, 30);
        ctx.drawImage(img, 0, 0, 30, 30);

        URL.revokeObjectURL(url);

        canvas.toBlob((blob) => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "bus_icon.png";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }, "image/png");
      };

      img.src = url;
    });
  </script>
</body>
</html>
