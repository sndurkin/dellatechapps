services:
  web:
    image: sndurkin/dellatechapps:latest
    ports:
      - "8000:8000"
    volumes:
      - static_files:/app/server/static/
    networks:
      - nginx-web
      - web-db
    environment:
      - DEBUG=False
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8000/health/" ]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - web-db
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "postgres", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx
    volumes:
      - /etc/nginx/:/etc/nginx/
      - static_files:/var/www/dellatechapps/
    ports:
      - "80:80"
      - "443:443"
    networks:
      - nginx-web
    depends_on:
      web:
        condition: service_healthy

  cron:
    image: sndurkin/dellatechapps:latest
    networks:
      - web-db
    environment:
      - DEBUG=False
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    env_file:
      - .env
    volumes:
      - ./crontab:/etc/cron.d/bus-data-cleanup
      - cron_logs:/var/log
    command: >
      sh -c "
        apt-get update && apt-get install -y cron &&
        chmod 0644 /etc/cron.d/bus-data-cleanup &&
        crontab /etc/cron.d/bus-data-cleanup &&
        cron -f
      "
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_files:
  cron_logs:

networks:
  nginx-web:
    driver: bridge
  web-db:
    driver: bridge
