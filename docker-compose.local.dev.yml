services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.local.dev
    ports:
      - "8000:8000"
      - "5173:5173"  # Expose Vite dev server port
    volumes:
      - .:/app  # Mount the current directory to enable live reloading
      - /app/server/web/node_modules  # Prevent overwriting node_modules
    networks:
      - nginx-web
      - web-db
    environment:
      - DEBUG=True
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - CHOKIDAR_USEPOLLING=true  # Enable polling for file changes
      - WATCHPACK_POLLING=true    # Enable polling for webpack
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8000/health/" ]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    networks:
      - web-db
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "postgres", "-U", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx
    volumes:
      - ./nginx.local.dev.conf:/etc/nginx/nginx.conf
      - ./server/static_files:/var/www/dellatechapps:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - nginx-web
    depends_on:
      web:
        condition: service_healthy


volumes:
  postgres_data:

networks:
  nginx-web:
    driver: bridge
  web-db:
    driver: bridge
